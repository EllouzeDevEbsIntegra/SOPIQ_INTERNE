<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PosCaisse — 4 pistes pour l'écran de vente</title>
<style>
:root{
  --ink:#14110E;--ink-2:#4A423A;--ink-3:#857B70;--ink-4:#B3A99C;
  --canvas:#F2F0EB;--surface:#fff;--surface-2:#FAF8F4;--surface-3:#F0EDE6;
  --line:#E3DED4;--line-2:#D3CCBF;
  --brand:#C8441C;--brand-2:#A8360F;--brand-soft:#FCEFE9;--brand-line:#F0CBBB;
  --pay:#15784A;--pay-2:#0F5E39;--pay-soft:#EAF5EF;
  --warn:#A2620A;--warn-soft:#FBF2E3;
  --r-xs:5px;--r-sm:7px;--r:10px;--r-lg:14px;
  --shadow-1:0 1px 2px rgba(20,17,14,.06),0 2px 8px rgba(20,17,14,.05);
  --shadow-2:0 10px 30px -12px rgba(20,17,14,.28);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- chrome du prototype ---------- */
.proto-bar{
  position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;
  padding:9px 16px;background:var(--ink);color:#fff;
}
.proto-bar h1{font-size:14px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.proto-bar h1 em{font-style:normal;color:#A69C90;font-weight:500}
.tabs{display:flex;gap:5px;margin-left:auto}
.tabs button{
  padding:7px 13px;border-radius:var(--r-sm);font-size:13px;font-weight:600;
  color:#C9C0B5;border:1px solid rgba(255,255,255,.14);white-space:nowrap;
}
.tabs button:hover{background:rgba(255,255,255,.08);color:#fff}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.reset{font-size:12.5px;color:#A69C90;text-decoration:underline;text-underline-offset:3px}

.brief{padding:14px 16px 0}
.brief-in{
  display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;
}
.brief h2{font-size:16.5px;letter-spacing:-.02em;margin-bottom:4px}
.brief p{font-size:13.5px;color:var(--ink-2);max-width:76ch}
.brief p + p{margin-top:5px}
.brief b{font-weight:650;color:var(--ink)}
.taps{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 16px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);white-space:nowrap}
.taps span{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.taps b{font-family:var(--font);font-size:26px;font-weight:750;letter-spacing:-.03em}
.taps i{font-style:normal;font-size:11.5px;color:var(--ink-3)}

.stage{padding:14px 16px 20px}
.screen{
  height:768px;max-height:calc(100vh - 40px);
  background:var(--canvas);border:1px solid var(--line-2);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--shadow-2);display:flex;flex-direction:column;
}
.screen-note{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 4px 0;font-size:11.5px;color:var(--ink-3)
}

/* ---------- éléments communs POS ---------- */
.topbar{
  display:flex;align-items:center;gap:12px;padding:0 14px;height:52px;flex:0 0 52px;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.02em;font-size:15px}
.logo i{width:26px;height:26px;border-radius:var(--r-xs);background:var(--brand);display:block}
.who{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-3)}
.who em{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;
  font-style:normal;font-size:11px;font-weight:700}
.srch{
  flex:1;max-width:340px;height:36px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);
  background:var(--surface-2);font:inherit;font-size:13.5px;
}
.srch:focus{outline:2px solid var(--brand-line);outline-offset:-1px;background:#fff}

.tile{
  position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:5px;
  padding:10px 11px;text-align:left;overflow:hidden;min-height:88px;
  background:var(--c-bg);border:1px solid var(--c-line);border-radius:var(--r);
  transition:background .1s,transform .06s,box-shadow .1s;
}
.tile::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--c)}
.tile:hover{background:#fff;box-shadow:var(--shadow-1)}
.tile:active{transform:translateY(1px)}
.tile .nm{font-size:14px;font-weight:600;line-height:1.2;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .ft{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tile .pr{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.tile .tag{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c);opacity:.85}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(clamp(140px,14vw,182px),1fr));
  align-content:start;overflow:auto;padding:12px}

.cat{
  display:flex;align-items:center;gap:9px;width:100%;padding:0 12px;height:52px;border-radius:var(--r-sm);
  font-size:14px;font-weight:600;color:var(--ink-2);text-align:left;
}
.cat i{width:8px;height:8px;border-radius:2px;background:var(--k);flex:0 0 8px}
.cat span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat b{font-size:11.5px;font-weight:600;color:var(--ink-4)}
.cat:hover{background:var(--surface-3)}
.cat.on{background:var(--ink);color:#fff}
.cat.on b{color:rgba(255,255,255,.55)}

.cart{display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line)}
.cart-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 9px}
.cart-hd h3{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.cart-hd .n{font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);
  border:1px solid var(--brand-line);border-radius:20px;padding:1px 9px}
.lines{flex:1;overflow:auto;padding:0 8px 8px}
.line{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;
  padding:9px 6px;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--line-2);border-radius:var(--r-xs);overflow:hidden}
.qty button{width:26px;height:28px;font-size:15px;font-weight:700;color:var(--ink-3);background:var(--surface-2)}
.qty button:hover{background:var(--surface-3);color:var(--ink)}
.qty b{min-width:26px;text-align:center;font-size:13.5px;font-weight:700}
.line .d{min-width:0}
.line .d strong{display:block;font-size:13.5px;font-weight:600;line-height:1.25}
.line .d small{font-size:11.5px;color:var(--ink-3)}
.line .amt{font-size:13.5px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:4px;margin-top:3px;padding:1px 7px;border-radius:20px;
  font-size:11px;font-weight:650;color:var(--brand);background:var(--brand-soft);border:1px solid var(--brand-line)}
.pill:hover{background:#F8DFD3}
.empty{padding:34px 16px;text-align:center;color:var(--ink-4);font-size:13.5px}
.tot{padding:11px 14px;border-top:1px solid var(--line);background:var(--surface-2)}
.tot .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);margin-bottom:3px}
.tot .big{display:flex;justify-content:space-between;align-items:baseline;margin-top:5px}
.tot .big span{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tot .big b{font-size:31px;font-weight:750;letter-spacing:-.035em}
.pay{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:60px;margin-top:9px;
  border-radius:var(--r);background:var(--pay);color:#fff;font-size:17px;font-weight:700;letter-spacing:-.01em}
.pay:hover{background:var(--pay-2)}
.pay:disabled{background:var(--line);color:var(--ink-4);cursor:not-allowed}

.sheet{position:absolute;inset:0;background:rgba(20,17,14,.42);display:grid;place-items:center;z-index:30;padding:24px}
.sheet .box{width:min(100%,460px);background:var(--surface);border-radius:var(--r-lg);
  box-shadow:var(--shadow-2);overflow:hidden}
.sheet h4{padding:16px 18px 3px;font-size:18px;letter-spacing:-.02em}
.sheet .sub{padding:0 18px 14px;font-size:13px;color:var(--ink-3)}
.opts{display:flex;flex-direction:column;gap:7px;padding:0 18px 16px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;height:56px;padding:0 15px;
  border:1px solid var(--line-2);border-radius:var(--r);font-size:15.5px;font-weight:600;text-align:left}
.opt:hover{border-color:var(--brand);background:var(--brand-soft)}
.opt .dd{font-size:13.5px;font-weight:700;color:var(--brand)}
.sheet .cancel{width:100%;height:46px;border-top:1px solid var(--line);font-size:14px;
  font-weight:600;color:var(--ink-3)}
.sheet .cancel:hover{background:var(--surface-2)}

/* Ancree en bas de la colonne grille : au centre elle masquait des articles,
   en bas au centre elle chevauchait la barre de total de la piste D. */
.flash{position:absolute;left:216px;bottom:16px;z-index:40;
  padding:9px 18px;border-radius:22px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;
  opacity:0;transition:opacity .18s;pointer-events:none;white-space:nowrap}
.flash.on{opacity:1}
.screen.d .flash{left:16px;bottom:172px}
</style></head><body>

<div class="proto-bar">
  <h1>PosCaisse <em>— 4 pistes pour l'écran de vente</em></h1>
  <div class="tabs" id="tabs"></div>
  <button class="reset" onclick="reset()">Vider le panier</button>
</div>

<div class="brief"><div class="brief-in">
  <div><h2 id="bTitle"></h2><div id="bText"></div></div>
  <div class="taps"><span>Taps / article</span><b id="bTaps"></b><i id="bTapsNote"></i></div>
</div></div>

<div class="stage">
  <div class="screen-note">
    <span id="noteL"></span><span>Cadre 1366 × 768 — écran de caisse 15 pouces</span>
  </div>
  <div class="screen" id="screen"></div>
</div>

const S = { tab:0, cat:0, cart:[], sheet:null, bread:{}, expanded:null, flash:'' };
const money = n => n.toFixed(3).replace('.', ',');
const cats = DATA.categories;
const total = () => S.cart.reduce((s,l)=>s+l.unit*l.qty,0);
const count = () => S.cart.reduce((s,l)=>s+l.qty,0);

function add(p, opt){
  const unit = p.price + (opt ? opt.d : 0);
  const key = p.code + '|' + (opt ? opt.n : '');
  const found = S.cart.find(l=>l.key===key);
  if (found) found.qty++;
  else S.cart.push({ key, code:p.code, name:p.name, opt:opt?opt.n:null, optName:p.optName, opts:p.opts, unit, qty:1 });
  toast(p.name + (opt ? ' · ' + opt.n : '') + ' ajouté');
  render();
}
function bump(i, d){ S.cart[i].qty += d; if (S.cart[i].qty <= 0) S.cart.splice(i,1); render(); }
function cycleOpt(i){
  const l = S.cart[i]; if (!l.opts) return;
  const j = l.opts.findIndex(o=>o.n===l.opt);
  const next = l.opts[(j+1) % l.opts.length];
  l.opt = next.n;
  const base = cats.flatMap(c=>c.products).find(p=>p.code===l.code);
  l.unit = base.price + next.d; l.key = l.code + '|' + next.n;
  render();
}
function reset(){ S.cart = []; S.sheet = null; S.expanded = null; render(); }
let flashTimer = null;
function toast(t){ S.flash = t; clearTimeout(flashTimer); flashTimer = setTimeout(()=>{ S.flash=''; render(); }, 1400); }

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tint = (hex,a) => { const h=hex.replace('#',''); const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; };

function tile(p, cat, extra=''){
  return `<button class="tile" style="--c:${cat.color};--c-bg:${tint(cat.color,.055)};--c-line:${tint(cat.color,.28)}"
    onclick="${extra||`tap('${p.code}')`}">
    <span class="nm">${esc(p.name)}</span>
    <span class="ft"><span class="pr num">${money(p.price)}</span>
    ${p.opts ? `<span class="tag">${p.optName}</span>` : ''}</span></button>`;
}
function topbar(extra=''){
  return `<div class="topbar"><div class="logo"><i></i>NUMBER ONE</div>
    ${extra}<input class="srch" placeholder="Rechercher un article…">
    <div class="who"><span>CAISSE 01</span><em>A</em></div></div>`;
}
function cartLines(){
  if (!S.cart.length) return `<div class="empty">Panier vide.<br>Touchez un article pour commencer.</div>`;
  return S.cart.map((l,i)=>`<div class="line">
    <span class="qty"><button onclick="bump(${i},-1)">−</button><b class="num">${l.qty}</b><button onclick="bump(${i},1)">+</button></span>
    <span class="d"><strong>${esc(l.name)}</strong>
      ${l.opt ? `<button class="pill" onclick="cycleOpt(${i})">${esc(l.optName)} : ${esc(l.opt)} ⇄</button>`
              : `<small>${money(l.unit)} l'unité</small>`}</span>
    <span class="amt num">${money(l.unit*l.qty)}</span></div>`).join('');
}
function totals(){
  return `<div class="tot">
    <div class="row"><span>${count()} article${count()>1?'s':''}</span><span class="num">${money(total())}</span></div>
    <div class="row"><span>TVA incluse</span><span class="num">${money(total()*0.19/1.19)}</span></div>
    <div class="big"><span>Total</span><b class="num">${money(total())} DT</b></div>
    <button class="pay" ${S.cart.length?'':'disabled'}>ENCAISSER</button></div>`;
}
function sheet(){
  if (!S.sheet) return '';
  const p = S.sheet;
  return `<div class="sheet" onclick="if(event.target===this){S.sheet=null;render()}"><div class="box">
    <h4>${esc(p.name)}</h4><div class="sub">Choisissez le ${esc(p.optName.toLowerCase())} — obligatoire</div>
    <div class="opts">${p.opts.map(o=>`<button class="opt" onclick="pick('${p.code}','${esc(o.n)}')">
      <span>${esc(o.n)}</span>${o.d ? `<span class="dd num">+${money(o.d)}</span>` : ''}</button>`).join('')}</div>
    <button class="cancel" onclick="S.sheet=null;render()">Annuler</button></div></div>`;
}
function flash(){ return `<div class="flash ${S.flash?'on':''}">${esc(S.flash)}</div>`; }
const byCode = c => cats.flatMap(x=>x.products).find(p=>p.code===c);
function tap(code){ const p = byCode(code); if (p.opts) { S.sheet = p; } else add(p); render(); }
function pick(code, optName){ const p = byCode(code); add(p, p.opts.find(o=>o.n===optName)); S.sheet = null; }

  add(p, p.opts[S.bread[S.cat] ?? 0]);
}
function addD(code){
  const p = byCode(code);
  add(p, p.opts ? p.opts[0] : null);   // pain par défaut, corrigeable dans le ticket
}

function render(){
  const p = P[S.tab];
  document.getElementById('tabs').innerHTML = P.map((x,i)=>
    `<button class="${i===S.tab?'on':''}" onclick="S.tab=${i};S.sheet=null;S.expanded=null;render()">${x.name}</button>`).join('');
  document.getElementById('bTitle').textContent = p.title;
  document.getElementById('bText').innerHTML = p.text;
  document.getElementById('bTaps').textContent = p.taps;
  document.getElementById('bTapsNote').textContent = p.tapsNote;
  document.getElementById('noteL').textContent = p.note;
  const scr = document.getElementById('screen');
  scr.className = 'screen ' + p.key.toLowerCase();
  scr.innerHTML = p.render();
  scr.style.position = 'relative';
}
render();
</script></body></html>
