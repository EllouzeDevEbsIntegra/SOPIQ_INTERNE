# Le back-office editeur : https://pos.ebs-integra.com
#
# A deposer dans /etc/nginx/sites-available/ puis a lier depuis sites-enabled/.
# Il ne touche a aucun des sites deja servis par cette machine.

server {
    listen 80;
    listen [::]:80;
    server_name pos.ebs-integra.com;

    # Le certificat se renouvelle par DNS (joker), pas par fichier : rien a servir en
    # clair ici, tout part vers HTTPS.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pos.ebs-integra.com;

    ssl_certificate     /etc/letsencrypt/live/pos.ebs-integra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.ebs-integra.com/privkey.pem;

    # Le back-office voit TOUS les clients : il ne doit jamais s'afficher dans le cadre
    # d'un autre site, et son adresse ne doit pas fuiter dans les referents sortants.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # LES PHOTOS D'ARTICLES VOYAGENT DANS LE CORPS DE LA REQUETE.
    # Elles ne partent pas sur un serveur de fichiers : elles sont encodees dans la fiche.
    # Une fiche avec sa photo et six photos de version depasse le mega-octet que nginx
    # accepte par defaut - et l'enregistrement echouerait avec un « 413 » que personne
    # ne relierait a une photo.
    client_max_body_size 8m;

    access_log /var/log/nginx/pos-plateforme.access.log;
    error_log  /var/log/nginx/pos-plateforme.error.log;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allumer une demonstration attend que systemd ait demarre la caisse : le
        # back-office s'accorde trente secondes, nginx doit lui en laisser davantage,
        # sinon l'ecran affiche une erreur alors que la demo demarre bel et bien.
        proxy_read_timeout 90s;
    }
}
