# LE FILET DU JOKER.
#
# L'enregistrement DNS « *.pos » envoie TOUT sous-domaine vers ce serveur - y compris ceux
# qui ne correspondent a aucune caisse. Sans ce fichier, nginx sert alors son site par
# defaut : le premier venu de la machine. On l'a vu au premier essai, ou
# demo-cafe.pos.ebs-integra.com affichait un autre site du meme serveur, avec en prime un
# avertissement de securite - le certificat de cet autre site ne portant pas ce nom-la.
#
# Sur une machine qui heberge plusieurs clients, une adresse inconnue ne doit jamais
# tomber chez quelqu'un d'autre.
#
# PAS DE default_server, ET C'EST DELIBERE. Un default_server capterait tout ce qui arrive
# sur la machine, y compris les domaines des autres applications - et nginx refuse de
# demarrer s'il en existe deja un ailleurs. On nomme donc precisement « *.pos.… » : nginx
# choisit toujours le server_name le plus precis, donc le vhost d'une caisse existante
# passe avant celui-ci, et seules les adresses sans caisse atterrissent ici.

server {
    listen 80;
    listen [::]:80;
    server_name *.pos.ebs-integra.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.pos.ebs-integra.com;

    # Le certificat joker couvre ces adresses : le visiteur lit le message au lieu de
    # buter d'abord sur un avertissement de securite.
    ssl_certificate     /etc/letsencrypt/live/pos.ebs-integra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.ebs-integra.com/privkey.pem;

    add_header Content-Type "text/plain; charset=utf-8" always;
    return 404 "Aucune caisse a cette adresse.\n";
}
