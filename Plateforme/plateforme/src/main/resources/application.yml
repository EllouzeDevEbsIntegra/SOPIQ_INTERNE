spring:
  application:
    name: plateforme
  datasource:
    url: jdbc:postgresql://${PLATEFORME_DB_HOST:localhost}:${PLATEFORME_DB_PORT:5432}/${PLATEFORME_DB_NAME:plateforme}
    username: ${PLATEFORME_DB_USER:postgres}
    password: ${PLATEFORME_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Africa/Tunis
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PLATEFORME_PORT:8090}

plateforme:
  # Requis seulement si la base ne contient encore aucun compte. Jamais journalise.
  admin-password: ${PLATEFORME_ADMIN_PASSWORD:}
  jwt:
    # Vide par defaut : la cle est tiree au sort et gardee en base, comme pour la caisse.
    secret: ${PLATEFORME_JWT_SECRET:}
    # Le back-office voit TOUS les clients : sa session est courte, contrairement a une
    # caisse ouverte du matin au soir.
    expiration-minutes: ${PLATEFORME_JWT_EXPIRATION_MINUTES:120}
  cors-origins: ${PLATEFORME_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  # Ce qu'on facture par defaut, en dinars, par caisse et par mois. Modifiable par client.
  tarif-mensuel-par-caisse: ${PLATEFORME_TARIF:49}
  # Nombre de jours d'impaye avant suspension. Un rappel part avant, toujours.
  jours-avant-suspension: ${PLATEFORME_JOURS_SUSPENSION:15}
  demo:
    # Le domaine sous lequel vivent les six demos : demo-cafe.pos.ebs-integra.com. Il n'est
    # pas en base, parce que la meme table sert sur la machine du developpeur.
    domaine: ${PLATEFORME_DEMO_DOMAINE:pos.ebs-integra.com}
    # Au bout de combien d'heures une demo s'eteint SEULE. Une oubliee le vendredi soir
    # tournerait sinon tout le week-end sur la memoire des clients qui, eux, paient.
    duree-max-heures: ${PLATEFORME_DEMO_DUREE_MAX_HEURES:24}
    # Comment on allume un poste : << systemd >> passe par /usr/local/sbin/poscaisse-demo.
    # Toute autre valeur laisse la place a un lanceur fourni ailleurs - c'est ce que font
    # les tests, qui verifient la remise a neuf de la base sans lancer de vrai processus.
    lanceur: ${PLATEFORME_DEMO_LANCEUR:systemd}
    # A quel rythme on regarde s'il y en a une a eteindre. Cinq minutes n'est pas la
    # precision de l'arret : c'est le retard maximum apres un redemarrage du back-office.
    verification: ${PLATEFORME_DEMO_VERIFICATION:PT5M}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
